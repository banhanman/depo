<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Depo — ваши агенты на вашем сервере</title>
  <desc id="desc">Самостоятельный веб-хаб для Claude Code, Codex, Gemini и Kimi Code</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151619"/>
      <stop offset="0.52" stop-color="#0e0f11"/>
      <stop offset="1" stop-color="#11100d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c96e"/>
      <stop offset="1" stop-color="#c88e34"/>
