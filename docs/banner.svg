    <radialGradient id="glow" cx="0.25" cy="0.35" r="0.72">
      <stop offset="0" stop-color="#d9a94c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#d9a94c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
