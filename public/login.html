<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depo — вход</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#0b0c0d">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login">
  <form id="f" autocomplete="on">
    <div class="brand">
      <span class="m"><img src="/icons/icon-180.png" alt="" width="58" height="58"></span>
      <b>Depo</b><span id="host"></span>
    </div>
    <label>Логин<input id="login" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
    <label>Пароль<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <label id="code-box" hidden>Код из Телеграма<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="000000"></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">Войти</button>
    <p class="foot">доступ только из локальной сети netbird</p>
    <p class="foot" id="tls-hint" hidden>Для микрофона нужен HTTPS: <a id="tls-link" style="color:var(--accent)">открыть по https</a> · <a href="/ca.crt" style="color:var(--accent)">сертификат для телефона</a></p>
  </form>
</main>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
document.getElementById('host').textContent = location.hostname;
document.getElementById('login').focus();
if (location.protocol === 'http:') {
  const h = document.getElementById('tls-hint'); h.hidden = false;
  document.getElementById('tls-link').href = `https://${location.hostname}:${(+location.port || 80) + 1}/`;
}
let ticket = null;
const codeBox = document.getElementById('code-box'), code = document.getElementById('code');
f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = ''; go.disabled = true; go.textContent = 'Проверяю…';
  try {
    const r = await fetch(ticket ? '/api/login/code' : '/api/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(ticket ? { ticket, code: code.value } : { login: login.value, password: password.value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (ticket && /заново/.test(d.error || '')) { ticket = null; codeBox.hidden = true; password.value = ''; }
      throw new Error(d.error || 'Не вышло войти.');
    }
    if (d.need_code) {
      // новое устройство: код пришёл в Телеграм
      ticket = d.ticket; codeBox.hidden = false; code.value = '';
      login.disabled = password.disabled = true;
      err.textContent = 'Отправил код в Телеграм — введи его.';
      go.disabled = false; go.textContent = 'Подтвердить'; code.focus();
      return;
    }
    location.href = '/';
  } catch (e) {
    err.textContent = e.message;
    go.disabled = false; go.textContent = ticket ? 'Подтвердить' : 'Войти';
    if (ticket) { code.value = ''; code.focus(); } else { login.disabled = password.disabled = false; password.value = ''; password.focus(); }
  }
});
code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); if (code.value.length === 6) f.requestSubmit(); });
</script>
</body>
</html>
